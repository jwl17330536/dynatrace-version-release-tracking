    query: "load \"/lookups/cmdb_businessapp\"\n| filter in(`name`, array($ApplicationName))\n\
      | filter (arraySize(array($FocusedApplication)) == 0) OR in(`name`, array($FocusedApplication))\n\
      | fields \n    `Application` = name, \n    cmdb_ci_key,\n    rum_expected =\
      \ rum_expected,\n    rum_domains\n| lookup [\n    load \"/lookups/cmdb_app_frontend_mapping\"\
      \n    | fields\n        app_key = app_cmdb_ci_key,\n        frontend_entity_id,\n\
      \        frontend_name,\n        user_event_count_24h,\n        session_count_24h,\n\
      \        last_seen_user_event,\n        mapping_confidence,\n        mapping_method\n\
      \    | fieldsAdd\n        user_event_count_24h = toLong(coalesce(user_event_count_24h,\
      \ 0)),\n        session_count_24h = toLong(coalesce(session_count_24h, 0))\n\
      \    | summarize\n        mapped_frontends = countDistinct(frontend_entity_id),\n\
      \        rum_user_events_24h = sum(user_event_count_24h),\n        rum_sessions_24h\
      \ = sum(session_count_24h),\n        rum_last_seen = max(last_seen_user_event),\n\
      \        rum_mapping_confidence = takeFirst(mapping_confidence),\n        rum_mapping_method\
      \ = takeFirst(mapping_method),\n        by:{app_key}\n  ], sourceField:cmdb_ci_key,\
      \ lookupField:app_key, fields:{mapped_frontends, rum_user_events_24h, rum_sessions_24h,\
      \ rum_last_seen, rum_mapping_confidence, rum_mapping_method}\n| fieldsAdd\n\
      \    mapped_frontends = coalesce(mapped_frontends, 0),\n    rum_user_events_24h\
      \ = coalesce(rum_user_events_24h, 0),\n    rum_sessions_24h = coalesce(rum_sessions_24h,\
      \ 0),\n    rum_mapping_confidence = coalesce(rum_mapping_confidence, \"none\"\
      ),\n    rum_mapping_method = coalesce(rum_mapping_method, \"none\")\n| fieldsAdd\n\
