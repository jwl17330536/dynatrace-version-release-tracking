    query: "load \"/lookups/cmdb_businessapp\"\n| filter in(`name`, array($ApplicationName))\n\
      | filter (arraySize(array($FocusedApplication)) == 0) OR in(`name`, array($FocusedApplication))\n\
      | fieldsAdd app_key = cmdb_ci_key, `Application` = name, app_short_name_lower\
      \ = lower(short_name)\n| lookup [\n    load \"/lookups/cmdb_server\"\n    |\
      \ fields app_key = busapp_cmdb_ci_key, server_name = name\n    | fieldsAdd server_name_lower\
      \ = lower(server_name)\n    | lookup [\n        fetch dt.entity.host\n     \
      \   | fields id, entity.name, tags\n        | parse entity.name, \"\"\"LD:hostname\
      \ ('.' LD:domain)? EOS\"\"\"\n        | fieldsAdd server_name_lower = lower(hostname)\n\
      \        | fields id, server_name_lower\n      ], sourceField:server_name_lower,\
      \ lookupField:server_name_lower, fields:{id}\n  ], sourceField:app_key, lookupField:app_key,\
      \ fields:{server_name, id}\n| lookup [\n    fetch dt.davis.problems\n    | filter\
