  '22':
    davis:
      davisVisualization:
        isAvailable: true
      enabled: false
    query: "load \"/lookups/cmdb_businessapp\"\n| filter in(`name`, array($ApplicationName))\n\
      | filter (arraySize(array($FocusedApplication)) == 0) OR in(`name`, array($FocusedApplication))\n\
      | fieldsAdd app_key = cmdb_ci_key, `Application` = name\n| lookup [\n    load\
      \ \"/lookups/cmdb_server\"\n    | fields app_key = busapp_cmdb_ci_key, server_name\
      \ = name, server_location = location\n    | fieldsAdd server_name_lower = lower(server_name)\n\
      \    | lookup [\n        fetch dt.entity.host\n        | fields id, entity.name,\
      \ monitoringMode, paasVendorType, isMonitoringCandidate, installerVersion\n\
      \        | fieldsAdd monitoringMode = if(isNotNull(paasVendorType), then:\"\
      APP_ONLY\", else:if(isMonitoringCandidate == true, then:\"CANDIDATE\", else:monitoringMode))\n\
      \        | parse entity.name, \"\"\"LD:hostname ('.' LD:domain)? EOS\"\"\"\n\
      \        | fieldsAdd server_name_lower = lower(hostname)\n        | lookup [\n\
      \            fetch logs\n            | summarize logCount = count(), by:{host_id\
      \ = dt.entity.host}\n          ], sourceField:id, lookupField:host_id, fields:{logCount}\n\
      \        | lookup [\n            fetch spans\n            | summarize spanCount\
      \ = count(), by:{host_id = dt.entity.host}\n          ], sourceField:id, lookupField:host_id,\
      \ fields:{spanCount}\n        | lookup [\n            timeseries cpu = avg(dt.host.cpu.usage),\
      \ by:{host_id = dt.entity.host}\n            | fieldsAdd metricEvidence = if(arraySize(arrayRemoveNulls(cpu))\
      \ > 0, then:1, else:0)\n            | fields host_id, metricEvidence\n     \
      \     ], sourceField:id, lookupField:host_id, fields:{metricEvidence}\n    \
      \    | summarize\n            hostMatch = max(if(isNotNull(id), then:1, else:0)),\n\
      \            fullStackCount = sum(if(monitoringMode == \"FULL_STACK\", then:1,\
      \ else:0)),\n            infraCount = sum(if(monitoringMode == \"INFRASTRUCTURE\"\
      , then:1, else:0)),\n            appOnlyCount = sum(if(monitoringMode == \"\
      APP_ONLY\", then:1, else:0)),\n            discoveryCount = sum(if(monitoringMode\
      \ == \"DISCOVERY\", then:1, else:0)),\n            traceEvidence = max(if(isNotNull(spanCount)\
      \ AND spanCount > 0, then:1, else:0)),\n            metricEvidence = max(coalesce(metricEvidence,\
      \ 0)),\n            logEvidence = max(if(isNotNull(logCount) AND logCount >\
      \ 0, then:1, else:0)),\n            by:{server_name_lower}\n      ], sourceField:server_name_lower,\
      \ lookupField:server_name_lower, fields:{hostMatch, fullStackCount, infraCount,\
      \ appOnlyCount, discoveryCount, traceEvidence, metricEvidence, logEvidence}\n\
      \  ], sourceField:app_key, lookupField:app_key, fields:{server_name, server_location,\
      \ hostMatch, fullStackCount, infraCount, appOnlyCount, discoveryCount, traceEvidence,\
      \ metricEvidence, logEvidence}\n| fieldsAdd\n    hostMatch = coalesce(hostMatch,\
      \ 0),\n    fullStackCount = coalesce(fullStackCount, 0),\n    infraCount = coalesce(infraCount,\
      \ 0),\n    appOnlyCount = coalesce(appOnlyCount, 0),\n    discoveryCount = coalesce(discoveryCount,\
      \ 0),\n    traceEvidence = coalesce(traceEvidence, 0),\n    metricEvidence =\
      \ coalesce(metricEvidence, 0),\n    logEvidence = coalesce(logEvidence, 0)\n\
      | fieldsAdd\n    `Dynatrace Match` = if(hostMatch > 0, then:\"\u2705\", else:\"\
      \u274C\"),\n    `Mode Detail` = if(hostMatch == 0, then:\"Missing\", else:if(fullStackCount\
      \ > 0 AND infraCount == 0 AND appOnlyCount == 0 AND discoveryCount == 0, then:\"\
      Full Stack\", else:if(infraCount > 0 AND fullStackCount == 0 AND appOnlyCount\
      \ == 0 AND discoveryCount == 0, then:\"Infrastructure\", else:if(appOnlyCount\
      \ > 0 AND fullStackCount == 0 AND infraCount == 0 AND discoveryCount == 0, then:\"\
      App Only\", else:if(discoveryCount > 0 AND fullStackCount == 0 AND infraCount\
      \ == 0 AND appOnlyCount == 0, then:\"Discovery\", else:\"Mixed\"))))),\n   \
      \ Traces = if(traceEvidence == 1, then:\"\u2705\", else:if(hostMatch == 1, then:\"\
      \u274C\", else:\"\u274C\")),\n    Metrics = if(metricEvidence == 1, then:\"\u2705\
      \", else:if(hostMatch == 1, then:\"\u274C\", else:\"\u274C\")),\n    Logs =\
      \ if(logEvidence == 1, then:\"\u2705\", else:if(hostMatch == 1, then:\"\u274C\
      \", else:\"\u274C\")),\n    `Server Quality` = if(hostMatch == 0, then:\"Missing\"\
      , else:if(traceEvidence == 1 AND metricEvidence == 1 AND logEvidence == 1, then:\"\
      Complete\", else:\"Weak Signals\"))\n| fieldsAdd ServerQualityRank = if(`Server\
      \ Quality` == \"Missing\", then:3, else:if(`Server Quality` == \"Weak Signals\"\
      , then:2, else:1))\n| filter in(`Application`, array($ApplicationName))\n| filter\
      \ in(server_location, array($Location))\n| filter in(`Mode Detail`, array($MonitoringMode))\n\
      | sort ServerQualityRank desc, server_name asc\n| fields `Application`, `Server`\
      \ = server_name, `Location` = server_location, `Dynatrace Match`, `Mode Detail`,\
      \ Traces, Metrics, Logs, `Server Quality`"
    querySettings:
      defaultSamplingRatio: 10
      defaultScanLimitGbytes: 5000
      enableSampling: false
      maxResultMegaBytes: 100
      maxResultRecords: 10000
    title: Server Coverage Drilldown (Selected App)
    type: data
    visualization: table
    visualizationSettings: {}
  '23':
    davis:
      davisVisualization:
        isAvailable: true
      enabled: false
    query: "load \"/lookups/cmdb_businessapp\"\n| filter in(`name`, array($ApplicationName))\n\
      | filter (arraySize(array($FocusedApplication)) == 0) OR in(`name`, array($FocusedApplication))\n\
      | fieldsAdd app_key = cmdb_ci_key, `Application` = name\n| lookup [\n    load\
      \ \"/lookups/cmdb_server\"\n    | fields app_key = busapp_cmdb_ci_key, server_name\
      \ = name\n    | fieldsAdd server_name_lower = lower(server_name)\n    | lookup\
      \ [\n        fetch dt.entity.host\n        | fields id, entity.name, monitoringMode,\
      \ paasVendorType, isMonitoringCandidate\n        | fieldsAdd monitoringMode\
      \ = if(isNotNull(paasVendorType), then:\"APP_ONLY\", else:if(isMonitoringCandidate\
      \ == true, then:\"CANDIDATE\", else:monitoringMode))\n        | parse entity.name,\
      \ \"\"\"LD:hostname ('.' LD:domain)? EOS\"\"\"\n        | fieldsAdd server_name_lower\
      \ = lower(hostname)\n        | fields server_name_lower, monitoringMode\n  \
      \    ], sourceField:server_name_lower, lookupField:server_name_lower, fields:{monitoringMode}\n\
      \  ], sourceField:app_key, lookupField:app_key, fields:{server_name, monitoringMode}\n\
      | fieldsAdd monitoringMode = coalesce(monitoringMode, \"Not Monitored\")\n|\
      \ fieldsAdd monitoringModeLabel = if(monitoringMode == \"FULL_STACK\", then:\"\
      Full Stack\", else:if(monitoringMode == \"INFRASTRUCTURE\", then:\"Infrastructure\"\
      , else:if(monitoringMode == \"APP_ONLY\", then:\"App Only\", else:if(monitoringMode\
      \ == \"DISCOVERY\", then:\"Discovery\", else:if(monitoringMode == \"Not Monitored\"\
      , then:\"Not Monitored\", else:\"Mixed\")))))\n| filter in(`Application`, array($ApplicationName))\n\
      | summarize `Server Count` = count(), by:{`Application`, `Monitoring Mode` =\
      \ monitoringModeLabel}\n| filter in(`Monitoring Mode`, array($MonitoringMode))\n\
      | sort `Application` asc, `Monitoring Mode` asc"
    querySettings:
      defaultSamplingRatio: 10
      defaultScanLimitGbytes: 5000
      enableSampling: false
      maxResultMegaBytes: 100
      maxResultRecords: 10000
    title: Monitoring Modes Breakdown (Selected App)
    type: data
    visualization: table
    visualizationSettings: {}
