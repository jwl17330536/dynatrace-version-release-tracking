      | parse entity.name, """LD:hostname (''.'' LD:domain)? EOS"""

      | limit 20000], sourceField:cmdbhostname, lookupField:hostname, fields:{id,
      hostname, monitoringMode}

      | filter isNotNull(hostname)

      | summarize `Total Applications` = count()

      | fieldsAdd `Application` = "All Applications"'
