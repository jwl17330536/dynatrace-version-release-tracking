      \ logs, quality\n      ], sourceField:server_name_lower, lookupField:server_name_lower,\
      \ fields:{traces, metrics, logs, quality}\n  ], sourceField:app_key, lookupField:app_key,\
      \ fields:{server_name, traces, metrics, logs, quality}\n| filter in(`Application`,\
