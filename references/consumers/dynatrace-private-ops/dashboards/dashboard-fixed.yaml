      \ affected_entity_id}\n  ], sourceField:id, lookupField:host_id, fields:{problem_count}\n\
      | fieldsAdd problem_count = coalesce(problem_count, 0)\n| filter in(`Application`,\
      \ array($ApplicationName))\n| filter problem_count > 0\n| fields `Application`,\
