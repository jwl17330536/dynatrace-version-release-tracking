      \ = name\n    | fieldsAdd server_name_lower = lower(server_name)\n    | lookup\
      \ [\n        fetch dt.entity.host\n        | fields id, entity.name\n      \
      \  | parse entity.name, \"\"\"LD:hostname ('.' LD:domain)? EOS\"\"\"\n     \
      \   | fieldsAdd server_name_lower = lower(hostname)\n        | lookup [\n  \
      \          fetch logs\n            | summarize logCount = count(), by:{host_id\
      \ = dt.entity.host}\n          ], sourceField:id, lookupField:host_id, fields:{logCount}\n\
      \        | lookup [\n            fetch spans\n            | summarize spanCount\
      \ = count(), by:{host_id = dt.entity.host}\n          ], sourceField:id, lookupField:host_id,\
      \ fields:{spanCount}\n        | lookup [\n            timeseries cpu = avg(dt.host.cpu.usage),\
      \ by:{host_id = dt.entity.host}\n            | fieldsAdd metricEvidence = if(arraySize(arrayRemoveNulls(cpu))\
      \ > 0, then:1, else:0)\n            | fields host_id, metricEvidence\n     \
      \     ], sourceField:id, lookupField:host_id, fields:{metricEvidence}\n    \
      \    | fieldsAdd\n            traces = if(isNotNull(spanCount) AND spanCount\
      \ > 0, then:\"\u2705\", else:\"\u274C\"),\n            metrics = if(isNotNull(metricEvidence)\
      \ AND metricEvidence == 1, then:\"\u2705\", else:\"\u274C\"),\n            logs\
      \ = if(isNotNull(logCount) AND logCount > 0, then:\"\u2705\", else:\"\u274C\"\
