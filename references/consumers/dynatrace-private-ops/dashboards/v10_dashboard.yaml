          prefixIcon: HostIcon
          recordField: Total Servers
    "15":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | summarize `Total Applications` = count()
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: Total Applications from CMDB
      type: data
      visualization: singleValue
      visualizationSettings:
        singleValue:
          prefixIcon: DesktopIcon
          recordField: Total Applications
    "16":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | fieldsAdd cmdb_ci_key, appname = name
        | lookup [load "/lookups/cmdb_server"], sourceField:cmdb_ci_key, lookupField:busapp_cmdb_ci_key, fields:{cmdbhostname = name, server_fqdn = fully_qualified_domain_name}
        | filter isNotNull(name)
        | lookup [
        fetch dt.entity.host
        | fields id, entity.name,  monitoringMode, paasVendorType, isMonitoringCandidate, awsNameTag
        | fieldsAdd monitoringMode = if(isNotNull(paasVendorType), "APP_ONLY", else:if(isMonitoringCandidate == true, "CANDIDATE", else:monitoringMode))
        | fieldsRemove paasVendorType, awsNameTag, isMonitoringCandidate
        | parse entity.name, """LD:hostname ('.' LD:domain)? EOS"""
        | limit 20000], sourceField:cmdbhostname, lookupField:hostname, fields:{id, hostname, monitoringMode}
        | filter isNotNull(hostname)
        | summarize `Total Applications` = count()
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 20000
      title: Total Applications in Dynatrace
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          prefixIcon: DesktopIcon
          recordField: Total Applications
    "17":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "load \"/lookups/cmdb_businessapp\"\n| summarize `Count` = count(), by:{`CMDB Tier` = business_criticality}\n| fieldsAdd sortOrder = if(`CMDB Tier` == \"Core Services\", 1, \n    else: if(`CMDB Tier` == \"Mission Critical\", 2, \n    else: if(`CMDB Tier` == \"Business Critical\", 3, \n    else: if(`CMDB Tier` == \"Business Essential\", 4, \n    else: 5))))\n| sort sortOrder asc\n| fieldsRemove sortOrder"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 1000
      title: CMDB Apps By Tier
      type: data
      visualization: categoricalBarChart
      visualizationSettings:
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: categorical
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "18":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | fields
            app_key = cmdb_ci_key,
            `Application` = name,
            `Tier` = business_criticality,
            `Status` = dv_operational_status,
            `Owner` = owned_by,
            `RUM Domains` = rum_domains,
            business_unit = dv_business_unit
        | filter in(`Application`, array($ApplicationName))
        | filter in(`Tier`, array($Tier))
        | filter in(`Status`, array($Status))
        | filter in(business_unit, array($BusinessUnit))
        | sort `Application` asc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 10000
      title: Application Observability Overview (Click to Select)
      type: data
      visualization: table
      visualizationSettings:
        table:
          sortBy:
            - columnId: '["Application"]'
              direction: ascending
    "19":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "fetch dt.entity.host\n| fieldsAdd host_name = entity.name\n| fields id, entity.name,  monitoringMode, paasVendorType, isMonitoringCandidate, awsNameTag\n| fieldsAdd monitoringMode = if(isNotNull(paasVendorType), \"APP_ONLY\", else:if(isMonitoringCandidate == true, \"CANDIDATE\", else:monitoringMode))\n| parse entity.name, \"\"\"LD:hostname ('.' LD:domain)? EOS\"\"\"\n| lookup [ load \"/lookups/cmdb_server\"], sourcefield:hostname, lookupfield:name, fields:{server_fqdn = fully_qualified_domain_name, cmdb_ci_key}\n| fieldsRemove paasVendorType, awsNameTag, isMonitoringCandidate\n| fieldsAdd isInCMDB = if(isNull(cmdb_ci_key), \"NOT FOUND IN CMDB\", else:\"FOUND IN CMDB\")\n| filterOut isInCMDB == \"NOT FOUND IN CMDB\" \n| filterOut monitoringMode == \"CANDIDATE\"\n| limit 20000\n| summarize `Monitored Servers` = count()"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 20000
      title: Servers Monitored by Dynatrace
      type: data
      visualization: singleValue
      visualizationSettings:
        singleValue:
          prefixIcon: HostIcon
          recordField: Monitored Servers
    "20":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | fields `Application` = name, AppShortName = short_name, owner = owned_by, `Business Unit` = dv_business_unit, tier = business_criticality, Status = dv_operational_status, cmdb_ci_key
        | lookup [
            load "/lookups/cmdb_server"
            | summarize `CMDB Servers` = count(), by:{busapp_cmdb_ci_key}
          ], sourceField:cmdb_ci_key, lookupField:busapp_cmdb_ci_key, fields:{`CMDB Servers`}
        | lookup [
            fetch dt.entity.host
            | fields id, entity.name
            | parse entity.name, """LD:hostname ('.' LD:domain)? EOS"""
            | limit 20000
            | lookup [load "/lookups/cmdb_server"], sourceField:hostname, lookupField:name, fields:{busapp_key = busapp_cmdb_ci_key}
            | filter isNotNull(busapp_key)
            | summarize dtHostCount = count(), by:{busapp_key}
          ], sourceField:cmdb_ci_key, lookupField:busapp_key, fields:{dtHostCount}
        | filter isNull(dtHostCount)
        | fieldsRemove dtHostCount, cmdb_ci_key
        | fieldsAdd `CMDB Servers` = coalesce(`CMDB Servers`, 0)
        | filter in(`Business Unit`, array($BusinessUnit))
        | filter in(tier, array($Tier))
        | filter in(Status, array($Status))
        | sort `Application` asc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 20000
      title: Applications Not in Dynatrace
      type: data
      visualization: table
      visualizationSettings:
        table:
          sortBy:
            - columnId: '["CMDB Servers"]'
              direction: descending
    "22":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | filter in(`name`, array($SelectedApplication))
        | fieldsAdd app_key = cmdb_ci_key, `Application` = name
        | lookup [
            load "/lookups/cmdb_server"
            | fields app_key = busapp_cmdb_ci_key, server_name = name, server_location = location
            | fieldsAdd server_name_lower = lower(server_name)
            | lookup [
                fetch dt.entity.host
                | fields id, entity.name, monitoringMode, paasVendorType, isMonitoringCandidate, installerVersion
                | fieldsAdd monitoringMode = if(isNotNull(paasVendorType), then:"APP_ONLY", else:if(isMonitoringCandidate == true, then:"CANDIDATE", else:monitoringMode))
                | parse entity.name, """LD:hostname ('.' LD:domain)? EOS"""
                | fieldsAdd server_name_lower = lower(hostname)
                | lookup [
                    fetch logs
                    | summarize logCount = count(), by:{host_id = dt.entity.host}
                  ], sourceField:id, lookupField:host_id, fields:{logCount}
                | lookup [
                    fetch spans
                    | summarize spanCount = count(), by:{host_id = dt.entity.host}
                  ], sourceField:id, lookupField:host_id, fields:{spanCount}
                | lookup [
                    timeseries cpu = avg(dt.host.cpu.usage), by:{host_id = dt.entity.host}
                    | fieldsAdd metricEvidence = if(arraySize(arrayRemoveNulls(cpu)) > 0, then:1, else:0)
                    | fields host_id, metricEvidence
                  ], sourceField:id, lookupField:host_id, fields:{metricEvidence}
                | summarize
                    hostMatch = max(if(isNotNull(id), then:1, else:0)),
                    fullStackCount = sum(if(monitoringMode == "FULL_STACK", then:1, else:0)),
                    infraCount = sum(if(monitoringMode == "INFRASTRUCTURE", then:1, else:0)),
                    appOnlyCount = sum(if(monitoringMode == "APP_ONLY", then:1, else:0)),
                    discoveryCount = sum(if(monitoringMode == "DISCOVERY", then:1, else:0)),
                    traceEvidence = max(if(isNotNull(spanCount) AND spanCount > 0, then:1, else:0)),
                    metricEvidence = max(coalesce(metricEvidence, 0)),
                    logEvidence = max(if(isNotNull(logCount) AND logCount > 0, then:1, else:0)),
                    by:{server_name_lower}
              ], sourceField:server_name_lower, lookupField:server_name_lower, fields:{hostMatch, fullStackCount, infraCount, appOnlyCount, discoveryCount, traceEvidence, metricEvidence, logEvidence}
          ], sourceField:app_key, lookupField:app_key, fields:{server_name, server_location, hostMatch, fullStackCount, infraCount, appOnlyCount, discoveryCount, traceEvidence, metricEvidence, logEvidence}
        | fieldsAdd
            hostMatch = coalesce(hostMatch, 0),
            fullStackCount = coalesce(fullStackCount, 0),
            infraCount = coalesce(infraCount, 0),
            appOnlyCount = coalesce(appOnlyCount, 0),
            discoveryCount = coalesce(discoveryCount, 0),
            traceEvidence = coalesce(traceEvidence, 0),
            metricEvidence = coalesce(metricEvidence, 0),
            logEvidence = coalesce(logEvidence, 0)
        | fieldsAdd
            `Dynatrace Match` = if(hostMatch > 0, then:"✅", else:"❌"),
            `Mode Detail` = if(hostMatch == 0, then:"Missing", else:if(fullStackCount > 0 AND infraCount == 0 AND appOnlyCount == 0 AND discoveryCount == 0, then:"Full Stack", else:if(infraCount > 0 AND fullStackCount == 0 AND appOnlyCount == 0 AND discoveryCount == 0, then:"Infrastructure", else:if(appOnlyCount > 0 AND fullStackCount == 0 AND infraCount == 0 AND discoveryCount == 0, then:"App Only", else:if(discoveryCount > 0 AND fullStackCount == 0 AND infraCount == 0 AND appOnlyCount == 0, then:"Discovery", else:"Mixed"))))),
            Traces = if(traceEvidence == 1, then:"✅", else:if(hostMatch == 1, then:"❌", else:"❌")),
            Metrics = if(metricEvidence == 1, then:"✅", else:if(hostMatch == 1, then:"❌", else:"❌")),
            Logs = if(logEvidence == 1, then:"✅", else:if(hostMatch == 1, then:"❌", else:"❌")),
            `Server Quality` = if(hostMatch == 0, then:"Missing", else:if(traceEvidence == 1 AND metricEvidence == 1 AND logEvidence == 1, then:"Complete", else:"Weak Signals"))
        | fieldsAdd ServerQualityRank = if(`Server Quality` == "Missing", then:3, else:if(`Server Quality` == "Weak Signals", then:2, else:1))
        | filter in(`Application`, array($ApplicationName))
        | filter in(server_location, array($Location))
        | sort ServerQualityRank desc, server_name asc
        | fields `Application`, `Server` = server_name, `Location` = server_location, `Dynatrace Match`, `Mode Detail`, Traces, Metrics, Logs, `Server Quality`
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 10000
      title: Server Coverage Drilldown (Selected App)
      type: data
      visualization: table
      visualizationSettings: {}
    "23":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | filter in(`name`, array($SelectedApplication))
        | fieldsAdd app_key = cmdb_ci_key, `Application` = name
        | lookup [
            load "/lookups/cmdb_server"
            | fields app_key = busapp_cmdb_ci_key, server_name = name
            | fieldsAdd server_name_lower = lower(server_name)
            | lookup [
                fetch dt.entity.host
                | fields id, entity.name, monitoringMode, paasVendorType, isMonitoringCandidate
                | fieldsAdd monitoringMode = if(isNotNull(paasVendorType), then:"APP_ONLY", else:if(isMonitoringCandidate == true, then:"CANDIDATE", else:monitoringMode))
                | parse entity.name, """LD:hostname ('.' LD:domain)? EOS"""
                | fieldsAdd server_name_lower = lower(hostname)
                | fields server_name_lower, monitoringMode
              ], sourceField:server_name_lower, lookupField:server_name_lower, fields:{monitoringMode}
          ], sourceField:app_key, lookupField:app_key, fields:{server_name, monitoringMode}
        | fieldsAdd monitoringMode = coalesce(monitoringMode, "Not Monitored")
        | filter in(`Application`, array($ApplicationName))
        | summarize `Server Count` = count(), by:{`Application`, `Monitoring Mode` = monitoringMode}
        | sort `Application` asc, `Monitoring Mode` asc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 10000
      title: Monitoring Modes Breakdown (Selected App)
      type: data
      visualization: table
      visualizationSettings: {}
    "24":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | filter in(`name`, array($SelectedApplication))
        | fieldsAdd app_key = cmdb_ci_key, `Application` = name
        | lookup [
            load "/lookups/cmdb_server"
            | fields app_key = busapp_cmdb_ci_key, server_name = name
            | fieldsAdd server_name_lower = lower(server_name)
            | lookup [
                fetch dt.entity.host
                | fields id, entity.name
                | parse entity.name, """LD:hostname ('.' LD:domain)? EOS"""
                | fieldsAdd server_name_lower = lower(hostname)
                | lookup [
                    fetch logs
                    | summarize logCount = count(), by:{host_id = dt.entity.host}
                  ], sourceField:id, lookupField:host_id, fields:{logCount}
                | lookup [
                    fetch spans
                    | summarize spanCount = count(), by:{host_id = dt.entity.host}
                  ], sourceField:id, lookupField:host_id, fields:{spanCount}
                | lookup [
                    timeseries cpu = avg(dt.host.cpu.usage), by:{host_id = dt.entity.host}
                    | fieldsAdd metricEvidence = if(arraySize(arrayRemoveNulls(cpu)) > 0, then:1, else:0)
                    | fields host_id, metricEvidence
                  ], sourceField:id, lookupField:host_id, fields:{metricEvidence}
                | fieldsAdd
                    traces = if(isNotNull(spanCount) AND spanCount > 0, then:"✅", else:"❌"),
                    metrics = if(isNotNull(metricEvidence) AND metricEvidence == 1, then:"✅", else:"❌"),
                    logs = if(isNotNull(logCount) AND logCount > 0, then:"✅", else:"❌"),
                    quality = if(isNotNull(spanCount) AND spanCount > 0 AND isNotNull(metricEvidence) AND metricEvidence == 1 AND isNotNull(logCount) AND logCount > 0, then:"Complete", else:"Partial")
                | fields server_name_lower, traces, metrics, logs, quality
              ], sourceField:server_name_lower, lookupField:server_name_lower, fields:{traces, metrics, logs, quality}
          ], sourceField:app_key, lookupField:app_key, fields:{server_name, traces, metrics, logs, quality}
        | filter in(`Application`, array($ApplicationName))
        | fields `Application`, `Server` = server_name, Traces = traces, Metrics = metrics, Logs = logs, `Evidence Quality` = quality
        | sort `Server` asc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 10000
      title: Observability Evidence by Server (Selected App)
      type: data
      visualization: table
      visualizationSettings: {}
    "25":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | filter in(`name`, array($SelectedApplication))
        | fieldsAdd app_key = cmdb_ci_key, app_short_name_lower = lower(short_name)
        | lookup [
            load "/lookups/cmdb_server"
            | fields app_key = busapp_cmdb_ci_key, server_name = name
            | fieldsAdd server_name_lower = lower(server_name)
            | lookup [
                fetch dt.entity.host
                | fields id, entity.name, tags
                | parse entity.name, """LD:hostname ('.' LD:domain)? EOS"""
                | fieldsAdd server_name_lower = lower(hostname)
                | fields id, server_name_lower
              ], sourceField:server_name_lower, lookupField:server_name_lower, fields:{id}
          ], sourceField:app_key, lookupField:app_key, fields:{server_name, id}
        | lookup [
            fetch dt.davis.problems
            | filter not(dt.davis.is_duplicate) AND event.status == "ACTIVE"
            | expand affected_entity_id = affected_entity_ids
            | filter matchesPhrase(affected_entity_id, "HOST-")
            | summarize problem_count = countDistinct(display_id), by:{host_id = affected_entity_id}
          ], sourceField:id, lookupField:host_id, fields:{problem_count}
        | fieldsAdd problem_count = coalesce(problem_count, 0)
        | filter in(`Application`, array($ApplicationName))
        | filter problem_count > 0
        | fields `Application`, `Server` = server_name, `Active Problems` = problem_count
        | sort `Active Problems` desc, `Server` asc
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 10000
      title: Active Problems (Selected App)
      type: data
      visualization: table
      visualizationSettings: {}
    "26":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "load \"/lookups/cmdb_businessapp\"\n| filter in(`name`, array($SelectedApplication))\n| fields \n    `Application` = name, \n    cmdb_ci_key,\n    rum_expected = rum_expected,\n    rum_domains\n| lookup [\n    load \"/lookups/cmdb_app_frontend_mapping\"\n    | fields\n        app_key = app_cmdb_ci_key,\n        frontend_entity_id,\n        frontend_name,\n        user_event_count_24h,\n        session_count_24h,\n        last_seen_user_event,\n        mapping_confidence,\n        mapping_method\n    | fieldsAdd\n        user_event_count_24h = toLong(coalesce(user_event_count_24h, 0)),\n        session_count_24h = toLong(coalesce(session_count_24h, 0))\n    | summarize\n        mapped_frontends = countDistinct(frontend_entity_id),\n        rum_user_events_24h = sum(user_event_count_24h),\n        rum_sessions_24h = sum(session_count_24h),\n        rum_last_seen = max(last_seen_user_event),\n        rum_mapping_confidence = takeFirst(mapping_confidence),\n        rum_mapping_method = takeFirst(mapping_method),\n        by:{app_key}\n  ], sourceField:cmdb_ci_key, lookupField:app_key, fields:{mapped_frontends, rum_user_events_24h, rum_sessions_24h, rum_last_seen, rum_mapping_confidence, rum_mapping_method}\n| fieldsAdd\n    mapped_frontends = coalesce(mapped_frontends, 0),\n    rum_user_events_24h = coalesce(rum_user_events_24h, 0),\n    rum_sessions_24h = coalesce(rum_sessions_24h, 0),\n    rum_mapping_confidence = coalesce(rum_mapping_confidence, \"none\"),\n    rum_mapping_method = coalesce(rum_mapping_method, \"none\")\n| fieldsAdd\n    `RUM Expected` = coalesce(rum_expected, \"No\"),\n    `RUM Status` = if(toLong(coalesce(rum_expected, 0)) == 0, then:\"N/A\", else:if(mapped_frontends == 0, then:\"Not Mapped\", else:\"Mapped\")),\n    `Mapped Frontends` = toString(mapped_frontends),\n    `User Events (24h)` = toString(rum_user_events_24h),\n    `Sessions (24h)` = toString(rum_sessions_24h),\n    `Mapping Method` = rum_mapping_method,\n    `Mapping Confidence` = rum_mapping_confidence,\n    `RUM Domains` = coalesce(rum_domains, \"N/A\")\n| filter in(`Application`, array($ApplicationName))\n| fields `Application`, `RUM Expected`, `RUM Status`, `Mapped Frontends`, `User Events (24h)`, `Sessions (24h)`, `Mapping Method`, `Mapping Confidence`, `RUM Domains`"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 10000
      title: RUM/Frontend Mappings (Selected App)
      type: data
      visualization: table
      visualizationSettings: {}
    "27":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "load \"/lookups/cmdb_businessapp\"\n| filter in(`name`, array($SelectedApplication))\n| fieldsAdd app_key = cmdb_ci_key, `Application` = name\n| lookup [\n    load \"/lookups/cmdb_server\"\n    | fields app_key = busapp_cmdb_ci_key, server_name = name\n    | fieldsAdd server_name_lower = lower(server_name)\n    | lookup [\n        fetch dt.entity.host\n        | fields id, entity.name\n        | parse entity.name, \"\"\"LD:hostname ('.' LD:domain)? EOS\"\"\"\n        | fieldsAdd server_name_lower = lower(hostname)\n        | fields id, server_name_lower\n      ], sourceField:server_name_lower, lookupField:server_name_lower, fields:{id}\n  ], sourceField:app_key, lookupField:app_key, fields:{server_name, id}\n| lookup [\n    fetch dt.entity.vulnerability\n    | summarize \n        critical_count = countDistinct(if(severity == \"CRITICAL\", display_id), default:0),\n        high_count = countDistinct(if(severity == \"HIGH\", display_id), default:0),\n        medium_count = countDistinct(if(severity == \"MEDIUM\", display_id), default:0),\n        low_count = countDistinct(if(severity == \"LOW\", display_id), default:0),\n        by:{host_id = dt.entity.host}\n  ], sourceField:id, lookupField:host_id, fields:{critical_count, high_count, medium_count, low_count}\n| fieldsAdd\n    critical_count = coalesce(critical_count, 0),\n    high_count = coalesce(high_count, 0),\n    medium_count = coalesce(medium_count, 0),\n    low_count = coalesce(low_count, 0),\n    total_vulns = critical_count + high_count + medium_count + low_count\n| filter in(`Application`, array($ApplicationName))\n| filter total_vulns > 0\n| fields `Application`, `Hostname` = server_name, Critical = critical_count, High = high_count, Medium = medium_count, Low = low_count, `Total Vulnerabilities` = total_vulns\n| sort Critical desc, High desc, `Hostname` asc"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 5000
        enableSampling: false
        maxResultMegaBytes: 100
        maxResultRecords: 10000
      title: Hosts + Vulnerability Counts (Selected App)
      type: data
      visualization: table
      visualizationSettings: {}
    "28":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_businessapp"
        | filter in(`name`, array($SelectedApplication))
        | fieldsAdd app_key = cmdb_ci_key, `Application` = name
        | lookup [
            load "/lookups/cmdb_server"
            | fields app_key = busapp_cmdb_ci_key, server_name = name
            | fieldsAdd server_name_lower = lower(server_name)
            | lookup [
                fetch dt.entity.host
                | fields id, entity.name
                | parse entity.name, """LD:hostname ('.' LD:domain)? EOS"""
                | fieldsAdd server_name_lower = lower(hostname)
                | fields id, server_name_lower
              ], sourceField:server_name_lower, lookupField:server_name_lower, fields:{id}
          ], sourceField:app_key, lookupField:app_key, fields:{server_name, id}
        | lookup [
            fetch dt.entity.service
            | fields service_id = id, service_name = entity.name, host_id = dt.entity.host
            | filter isNotNull(host_id)
            | lookup [
                timeseries
                    error_rate = (sum(dt.service.request.count.server, filter: in(span.status, {"ERROR"})) / sum(dt.service.request.count.server)) * 100,
                    p95_latency = percentile(dt.service.response_time, 95),
                    by:{service_id}
              ], sourceField:service_id, lookupField:service_id, fields:{error_rate, p95_latency}
          ], sourceField:id, lookupField:host_id, fields:{service_name, error_rate, p95_latency}
        | fieldsAdd
            error_rate = coalesce(round(error_rate, 2), 0),
            p95_latency = coalesce(round(p95_latency, 0), 0)
        | filter in(`Application`, array($ApplicationName))
        | summarize service_count = count(), by:{`Service` = service_name, `Error Rate %` = error_rate, `P95 Latency (ms)` = p95_latency}
        | sort `Error Rate %` desc, `Service` asc
