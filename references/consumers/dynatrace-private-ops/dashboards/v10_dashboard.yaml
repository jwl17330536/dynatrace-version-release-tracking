    "0":
      content: '# ✅ Observability Health Report (v10 - Selector-Driven Tier 1 Support)'
      type: markdown
    "13":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        load "/lookups/cmdb_server"
        | summarize `Total Servers` = count()
      querySettings:
        defaultSamplingRatio: 10
